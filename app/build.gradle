plugins {
    alias(libs.plugins.android.application)
}

// versionName = the milestone (0.1.0) + the exact commit sha, so a build always maps back to a commit;
// versionCode = commit count (monotonic). Bump the milestone by hand at each release.
def RELEASE = "0.2.4"
def gitCount = { ->
    try { return "git rev-list --count HEAD".execute(null, rootDir).text.trim().toInteger() }
    catch (ignored) { return 1 }
}
def gitSha = { ->
    try { return "git rev-parse --short HEAD".execute(null, rootDir).text.trim() }
    catch (ignored) { return "dev" }
}

android {
    namespace 'com.eurobuddha.openly'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.openly"
        minSdk 28
        targetSdk 35
        versionCode gitCount()
        versionName RELEASE + "+" + gitSha()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore (IPC is authorised by the MINIMA_ID token,
            // not by signature — matches the whole companion-app family).
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Android 15+/16 want 16 KB-aligned native libs. Uncompressed + zip-aligned .so is the modern
    // default; combined with JNA 5.14 (16 KB-aligned libjnidispatch.so) this clears the JNA warning.
    // libsodium.so (lazysodium 5.1.0) is still not internally 16 KB-aligned — a dismissible warning,
    // not a crash; testing proceeds. Tracked to fix before a Play release.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed UI
    implementation 'androidx.viewpager:viewpager:1.0.0'

    // Background refresh: WorkManager re-launches the foreground service if the OS kills it.
    implementation 'androidx.work:work-runtime:2.9.1'

    // Minima Core IPC client SDK (the only way this app reaches the node)
    implementation files('libs/minimaapi.aar')

    // Client-side end-to-end crypto for comms: X25519 sealed box + Ed25519 (libsodium).
    // The node has no Maxima over IPC, so all encryption/signing happens in-app; the node
    // only carries the sealed blob in coin state. Keys derive from the Minima seed.
    implementation 'com.goterl:lazysodium-android:5.2.0@aar'  // 16 KB-aligned libsodium.so (all ABIs)
    implementation 'net.java.dev.jna:jna:5.14.0@aar'          // 16 KB-aligned libjnidispatch.so
}
