plugins {
    alias(libs.plugins.android.application)
}

// versionName = the milestone + the exact commit sha, so a build always maps back to a commit.
// versionCode = minor*100 + patch, derived from RELEASE below — the family convention
// (0.2.9 -> 209, 0.4.3 -> 403). It used to be the commit count, which was monotonic and never
// broke, but sat far below where the convention puts it: the first release numbered correctly
// would then have been a downgrade, which is how Terminal IDE stranded its own numbering.
// Realigned while the convention value is still an increase. Bump RELEASE by hand each release;
// the code follows automatically, so the two can no longer disagree.
def RELEASE = "0.2.6"
// minor*100 + patch, read straight off RELEASE so the two can never drift apart.
def releaseCode = { ->
    def p = RELEASE.tokenize('.')
    return p[1].toInteger() * 100 + p[2].toInteger()
}
def gitSha = { ->
    try { return "git rev-parse --short HEAD".execute(null, rootDir).text.trim() }
    catch (ignored) { return "dev" }
}

android {
    namespace 'com.eurobuddha.openly'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.openly"
        minSdk 28
        targetSdk 35
        versionCode releaseCode()
        versionName RELEASE + "+" + gitSha()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // True only when the family release key is configured (props live in ~/.gradle/gradle.properties,
    // outside every repo, so nothing secret is committed). Drives the debug-signing fallback below.
    def hasReleaseKey = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE') != null
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE'))
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with the family release key when its props are present; otherwise fall back to the
            // debug keystore so a release build still succeeds on a machine without the key. (IPC is
            // authorised by the MINIMA_ID token, not by signature — matches the companion-app family.)
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Android 15+/16 want 16 KB-aligned native libs. Uncompressed + zip-aligned .so is the modern
    // default; combined with JNA 5.14 (16 KB-aligned libjnidispatch.so) this clears the JNA warning.
    // libsodium.so (lazysodium 5.1.0) is still not internally 16 KB-aligned — a dismissible warning,
    // not a crash; testing proceeds. Tracked to fix before a Play release.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed UI
    implementation 'androidx.viewpager:viewpager:1.0.0'

    // Background refresh: WorkManager re-launches the foreground service if the OS kills it.
    implementation 'androidx.work:work-runtime:2.9.1'

    // Minima Core IPC client SDK (the only way this app reaches the node)
    implementation files('libs/minimaapi.aar')

    // Client-side end-to-end crypto for comms: X25519 sealed box + Ed25519 (libsodium).
    // The node has no Maxima over IPC, so all encryption/signing happens in-app; the node
    // only carries the sealed blob in coin state. Keys derive from the Minima seed.
    implementation 'com.goterl:lazysodium-android:5.2.0@aar'  // 16 KB-aligned libsodium.so (all ABIs)
    implementation 'net.java.dev.jna:jna:5.14.0@aar'          // 16 KB-aligned libjnidispatch.so
}
